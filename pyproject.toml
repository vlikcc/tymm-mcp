[project]
name = "tymm-mcp"
version = "0.1.0"
description = "Türkiye Yüzyılı Maarif Modeli (tymm.meb.gov.tr) için MCP sunucusu: öğretim programları, üniteler, öğrenme çıktıları ve ders kitapları."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
tymm-mcp = "tymm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tymm_mcp"]
